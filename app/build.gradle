plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tomato.tApp'
    compileSdk 36

    defaultConfig {
        applicationId 'com.tomato.tApp'
        minSdk 23
        targetSdk 36
        versionCode 3
        versionName '1.2'

        // OpenCV ships native code for every CPU type, which makes the APK big.
        // These three cover virtually all phones and the emulator.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'org.opencv:opencv:4.10.0'

    // CameraX: PaperSnap's own camera with the live page outline
    implementation 'androidx.camera:camera-core:1.4.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'
}
